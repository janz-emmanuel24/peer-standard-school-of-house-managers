user  nginx;
worker_processes auto;

events {
    worker_connections 1024;
}

http {
    # Upstream Django server
    upstream django {
        server web:8000;
    }

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=10r/s;
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;

    # ===============================
    # HTTP (port 80) → HTTPS redirect
    # ===============================
    server {
        listen 80;
        server_name peer-standard.com;

        # Redirect all plain HTTP to HTTPS
        return 301 https://www.peer-standard.com$request_uri;
    }

    # ===============================
    # HTTPS (port 443)
    # ===============================
    server {
#        listen 443 ssl;
        #http2 on;
	listen 80;
        server_name www.peer-standard.com 5.189.156.181 localhost 127.0.0.1;
        client_max_body_size 100M;

        # SSL Certificates
        #ssl_certificate /etc/letsencrypt/live/peer-standard.com/fullchain.pem;
        #ssl_certificate_key /etc/letsencrypt/live/peer-standard.com/privkey.pem;
        #ssl_protocols TLSv1.2 TLSv1.3;
        #ssl_ciphers HIGH:!aNULL:!MD5;

        # ===============================
        # Static files
        # ===============================
        location /static/ {
            alias /app/staticfiles/;
        }

        # Media files
        location /media/ {
            alias /media/;
            expires 7d;
            add_header Cache-Control "public";
        }

        # ===============================
        # API endpoints with rate limiting
        # ===============================
        location /api/ {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Login endpoints with stricter rate limiting
        location ~ ^/(accounts/login|api/token)/ {
            limit_req zone=login_limit burst=3 nodelay;
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
        }

        # ===============================
        # All other requests
        # ===============================
        location / {
            proxy_pass http://django;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto $scheme;
            proxy_redirect off;
            proxy_read_timeout 300s;
            proxy_connect_timeout 75s;
        }

        # Health check endpoint
        location /health/ {
            access_log off;
            proxy_pass http://django;
            proxy_set_header Host $host;
        }
    }
}
